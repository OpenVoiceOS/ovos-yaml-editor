name: Stable Release
on:
  push:
    branches: [master]
  workflow_dispatch:

# This calls OpenVoiceOS/gh-automations, the same organisation's automation that
# release_workflow.yml already uses for alphas. The previous version called
# TigreGotico/gh-automations' publish-stable.yml, which reads the version with
# "python action/package/setup.py --version" and so cannot work without a
# setup.py. The two inline jobs it carried, publish_pypi and sync_dev, ran
# setup.py directly as well; the shared workflow takes each as an input, so they
# are named below instead of repeated here.
jobs:
  publish_stable:
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-stable.yml@dev
    secrets: inherit
    with:
      branch: 'master'
      version_file: 'ovos_yaml_editor/version.py'
      publish_release: true
      # was the inline publish_pypi job: python setup.py sdist bdist_wheel, then
      # pypa/gh-action-pypi-publish with PYPI_TOKEN
      publish_pypi: true
      # was the inline sync_dev job: push master -> dev
      sync_dev: true
