name: Unit Tests

on:
  push:
    branches: [dev]
    paths:
      - 'ovos_yaml_editor/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/unit_tests.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'ovos_yaml_editor/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/unit_tests.yml'
  workflow_dispatch: {}

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      # The 'test' extra in pyproject.toml: pytest, and httpx capped below 1.0
      # because fastapi.testclient does not run on the httpx 1.0 development
      # line. UV_PRERELEASE is "allow" in the reusable workflow, so an
      # uncapped httpx resolves to 1.0.dev6 and the suite cannot even be
      # collected: starlette.testclient reads httpx.BaseTransport, which 1.0
      # renamed.
      install_extras: "test"
      test_path: "tests"
      # build-tests.yml is the only workflow here that runs pytest, so a
      # test_path that stops covering the suite must fail rather than warn.
      test_path_strict: true
